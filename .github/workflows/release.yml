name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Build provenance attestation for the release files (verify with `gh attestation verify`).
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Build and check
        shell: pwsh
        run: |
          dotnet build FastTorrentDownload.sln --configuration Release --nologo
          dotnet run --project tests/FastTorrentDownload.Tests/FastTorrentDownload.Tests.csproj --configuration Release
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Publish portable app, checksum, and installer
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          .\scripts\Publish.ps1 -Version $version
      - name: Publish GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          body: |
            Unsigned early-release binaries may trigger Microsoft SmartScreen. Verify the SHA-256 checksum before opening the portable ZIP or installer.
          files: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/*-setup.exe
      # After publishing, so a failed attestation never blocks the release itself.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.2.0
        with:
          subject-path: |
            artifacts/*.zip
            artifacts/*-setup.exe
